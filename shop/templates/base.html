{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClothesShop{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom py-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}">ClothesShop</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNav" aria-controls="navbarNav"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link {% block active_home %}{% endblock %}" href="{% url 'home' %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% block active_about %}{% endblock %}" href="{% url 'about' %}">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% block active_product_list %}{% endblock %}" href="#">Product list</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 my-5">
        <h1 class="fw-bold display-6 text-center border-bottom pb-2">{% block heading %}{% endblock %}</h1>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light border-top py-4 mt-auto">
        <div class="container text-center">
            <p class="fw-semibold text-dark mb-1">ClothesStore</p>
            <p class="text-body-secondary small mb-2">
                A learning pet-project built with Python, Django & Bootstrap.
            </p>
            <p class="text-muted small mb-0">
                &copy; 2026 ClothesShop. All rights reserved.
            </p>
        </div>
    </footer>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
